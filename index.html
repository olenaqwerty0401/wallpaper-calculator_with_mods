<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Калькулятор шпалер — тестова версія</title>
<style>html{color-scheme:light dark}body{margin:0;font-family:system-ui;background:light-dark(#f7faf7,#17231b)}main{max-width:1100px;margin:auto}button,summary{cursor:pointer}</style>
</head>
<body><main>
<div id="room-walls" aria-label="Пропозиція калькулятора стін">
<style>
#room-walls{font:16px/1.5 system-ui;color:light-dark(#233a2b,#e5efe8);background:light-dark(#f7faf7,#17231b);padding:24px;border-radius:16px;color-scheme:light dark}
#room-walls *{box-sizing:border-box}#room-walls h2{font-size:22px;font-weight:500;margin:0}#room-walls h3{font-size:17px;font-weight:500;margin:18px 0 10px}#room-walls .rw-note{font-size:13px;opacity:.8;margin:6px 0 16px}#room-walls .rw-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 0}#room-walls button{font:inherit;padding:10px 14px;border:1px solid light-dark(#cad7cd,#48634f);border-radius:8px;background:light-dark(#fff,#26382a);color:inherit;min-height:44px}#room-walls button[aria-pressed=true],#room-walls .rw-main{background:light-dark(#295c3b,#9bd1ab);color:light-dark(#fff,#16231b)}#room-walls select,#room-walls input{font:inherit;padding:8px;border:1px solid light-dark(#cad7cd,#48634f);border-radius:7px;background:light-dark(#fff,#24362a);color:inherit;width:100%;min-width:0;min-height:44px}#room-walls .rw-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}#room-walls fieldset{border:0;margin:0;padding:0;min-width:0}#room-walls legend,#room-walls label{font-size:13px}#room-walls legend{padding:0;margin-bottom:4px}#room-walls .rw-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}#room-walls label input,#room-walls label select{margin-top:4px}#room-walls .rw-wall{border-top:1px solid light-dark(#cdd9d0,#3c5543);padding:12px 0}#room-walls .rw-heading{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#room-walls .rw-title{flex:1;text-align:left}#room-walls .rw-editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin:12px 0}#room-walls svg{width:100%;height:220px;display:block}#room-walls .rw-output{padding:14px;background:light-dark(#e3eee5,#293f2f);border-radius:9px;margin-top:16px}#room-walls .rw-check{display:flex;gap:8px;align-items:center;min-height:44px}#room-walls .rw-check input{width:20px;min-height:20px;margin:0}#room-walls .rw-wide{grid-column:1/-1}#room-walls .rw-error{color:light-dark(#ae2929,#ffbaba);font-size:13px}#room-walls [hidden]{display:none!important}#room-walls details{margin:10px 0}#room-walls .rw-cuts{font-size:13px;white-space:pre-line;overflow-wrap:anywhere}@media(max-width:600px){#room-walls{padding:16px}#room-walls .rw-editor{grid-template-columns:1fr}#room-walls .rw-grid{grid-template-columns:1fr}#room-walls .rw-pair{grid-template-columns:1fr 1fr}}
</style>
<h2>Шпалери для кімнати</h2><div class="rw-note">Тестова версія · параметри шпалер вручну · алгоритм ще не звірено з основним калькулятором</div>
<div class="rw-bar" aria-label="Одиниці для всього розрахунку"><button type="button" class="cursor-interaction" data-unit="metric" aria-pressed="true">Метри / сантиметри</button><button type="button" class="cursor-interaction" data-unit="imperial" aria-pressed="false">Фути / дюйми</button></div>
<h3>Стіни</h3><div data-walls></div><div class="rw-bar"><button type="button" data-add class="rw-main cursor-interaction">+ Додати стіну</button></div>
<h3>Шпалери</h3><div class="rw-grid" data-paper></div>
<div class="rw-output" aria-live="polite" data-result></div><details><summary>Детальний розкрій — по рулонах</summary><div class="rw-cuts" data-cuts></div></details><div class="rw-note">Без додаткового запасу на відходи · припуск на підрізання враховано · демонстраційний розрахунок</div>
<style>
#room-walls .rw-cuts{white-space:normal}#room-walls .rw-roll{margin:18px 0 24px;padding:16px;background:light-dark(#fff,#24362a);border:1px solid light-dark(#cad7cd,#48634f);border-radius:10px}#room-walls .rw-roll h3{margin:0 0 6px}#room-walls .rw-roll table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}#room-walls .rw-roll th,#room-walls .rw-roll td{text-align:left;padding:10px 4px;border-bottom:1px solid light-dark(#dce5de,#3c5543);overflow-wrap:anywhere}#room-walls .rw-roll th{font-weight:500}#room-walls .rw-roll-foot{margin-top:12px;font-size:13px}
</style>
<script>
(()=>{const root=document.getElementById('room-walls');const names={rect:'Прямокутник',one:'Трапеція — один скіс',two:'Трапеція — два скоси',tri:'Трикутник'};let unit='metric',next=3,active=1;let walls=[{id:1,shape:'rect',bottom:4,height:2.7,top:2,offset:1,sym:true,side:'right'},{id:2,shape:'one',bottom:4,height:2.7,top:2,offset:1,sym:true,side:'right'}];const paper={width:.53,length:10.05,extra:.1,repeat:0};const fmt=n=>n.toLocaleString('uk-UA',{maximumFractionDigits:2});
function split(m){const factor=unit==='metric'?100:1/.0254,base=unit==='metric'?100:12;let total=m*factor;let large=Math.floor((total+1e-9)/base),small=Math.round((total-large*base)*1000)/1000;if(small>=base){large++;small=0}return[large,small]}
function field(label,k,m,id){const vals=split(m),labels=unit==='metric'?['м','см']:['фути','дюйми'];return `<fieldset><legend>${label}</legend><div class="rw-pair">${labels.map((l,i)=>`<label>${l}<input type="number" min="0" step="${i===0?'1':'.001'}" value="${vals[i]}" data-value="${k}" data-part="${i}" data-owner="${id}" aria-label="${label}, ${l}"></label>`).join('')}</div></fieldset>`}
function length(m){const [a,b]=split(m);return unit==='metric'?`${a} м ${fmt(b)} см`:`${a} футів ${fmt(b)} дюймів`}
function geometry(w){const B=w.bottom,H=w.height,T=w.shape==='rect'?B:w.shape==='tri'?0:w.top;const a=w.shape==='rect'?0:w.shape==='one'?(w.side==='right'?0:B-T):w.sym?(B-T)/2:w.offset;return{B,H,T,a,b:a+T}}
function validate(w){const g=geometry(w);if(!Object.values(g).every(Number.isFinite)||g.B<=0||g.H<=0||g.T<0||g.a<0||g.b>g.B||(w.shape!=='tri'&&g.T<=0))return 'Перевір розміри: верхній край має бути в межах нижньої ширини.';return ''}
function build(){root.querySelectorAll('[data-unit]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.unit===unit)));root.querySelector('[data-walls]').innerHTML=walls.map((w,i)=>{const open=w.id===active;return `<section class="rw-wall" data-wall="${w.id}"><div class="rw-heading"><button type="button" class="rw-title cursor-interaction" data-open="${w.id}" aria-expanded="${open}">Стіна ${i+1} · ${names[w.shape]}</button><button type="button" class="cursor-interaction" data-remove="${w.id}" aria-label="Видалити стіну ${i+1}">Видалити</button></div><div class="rw-editor" ${open?'':'hidden'}><div class="rw-grid"><label class="rw-wide">Форма<select data-shape="${w.id}">${Object.entries(names).map(([k,n])=>`<option value="${k}" ${k===w.shape?'selected':''}>${n}</option>`).join('')}</select></label>${field(w.shape==='rect'?'Ширина':'Ширина внизу','bottom',w.bottom,w.id)}${field('Висота','height',w.height,w.id)}${['one','two'].includes(w.shape)?field('Ширина вгорі','top',w.top,w.id):''}${w.shape==='one'?`<label>Сторона скосу<select data-side="${w.id}"><option value="right" ${w.side==='right'?'selected':''}>Праворуч</option><option value="left" ${w.side==='left'?'selected':''}>Ліворуч</option></select></label>`:''}${['two','tri'].includes(w.shape)?`<label class="rw-check rw-wide"><input type="checkbox" data-sym="${w.id}" ${w.sym?'checked':''}>Симетрична форма</label>`:''}${['two','tri'].includes(w.shape)&&!w.sym?field(w.shape==='tri'?'Відстань до вершини зліва':'Відступ верхнього лівого кута','offset',w.offset,w.id):''}</div><div><svg data-diagram="${w.id}" role="img" aria-label="Контур стіни ${i+1} та смуги шпалер"></svg><div class="rw-error" role="alert" data-error="${w.id}"></div><div class="rw-note" data-summary="${w.id}"></div></div></div></section>`}).join('');root.querySelector('[data-paper]').innerHTML=field('Ширина рулону','width',paper.width,'paper')+field('Довжина рулону','length',paper.length,'paper')+field('Припуск сумарно на смугу','extra',paper.extra,'paper')+field('Повтор малюнка (0 — без підбору)','repeat',paper.repeat,'paper');calculate()}
function diagram(w,g){const svg=root.querySelector('[data-diagram="'+w.id+'"]');if(w.id!==active)return;const width=Math.max(220,svg.getBoundingClientRect().width),scale=Math.min((width-32)/g.B,160/g.H),x=v=>16+v*scale,y=v=>190-v*scale;svg.setAttribute('viewBox',`0 0 ${width} 220`);const pts=`${x(0)},${y(0)} ${x(g.B)},${y(0)} ${x(g.b)},${y(g.H)} ${x(g.a)},${y(g.H)}`;let out=`<defs><clipPath id="rw-clip-${w.id}"><polygon points="${pts}"/></clipPath></defs><polygon points="${pts}" fill="currentColor" fill-opacity=".08" stroke="currentColor" stroke-width="1.5"/>`;if(paper.width>0&&g.B/paper.width<=300)for(let z=paper.width;z<g.B-1e-9;z+=paper.width)out+=`<line x1="${x(z)}" x2="${x(z)}" y1="${y(0)}" y2="${y(g.H)}" stroke="currentColor" stroke-opacity=".35" clip-path="url(#rw-clip-${w.id})"/>`;out+=`<text x="${width/2}" y="214" fill="currentColor" font-size="13" text-anchor="middle">${length(g.B)}</text>`;svg.innerHTML=out}
function calculate(){let all=[],area=0,errors=[];const validPaper=Object.values(paper).every(Number.isFinite)&&paper.width>0&&paper.length>0&&paper.extra>=0&&paper.repeat>=0;if(!validPaper)errors.push('Перевір параметри шпалер.');walls.forEach((w,wi)=>{const g=geometry(w),error=validate(w)||((validPaper&&g.B/paper.width>300)?'Для прототипу — максимум 300 смуг на стіну.':'');root.querySelector('[data-error="'+w.id+'"]').textContent=error;if(error){errors.push(error);root.querySelector('[data-diagram="'+w.id+'"]').innerHTML='';root.querySelector('[data-summary="'+w.id+'"]').textContent='';return}area+=(g.B+g.T)*g.H/2;diagram(w,g);if(validPaper&&g.B/paper.width<=300){const h=z=>z<g.a?g.H*z/g.a:z>g.b?g.H*(g.B-z)/(g.B-g.b):g.H;for(let j=0;j<Math.ceil(g.B/paper.width-1e-9);j++){const l=j*paper.width,r=Math.min(g.B,l+paper.width);let height=Math.max(h(l),h(r));if(l<=g.b&&r>=g.a)height=g.H;let cut=height+paper.extra;if(paper.repeat>0)cut=Math.ceil((cut-1e-9)/paper.repeat)*paper.repeat;all.push({length:cut,wall:wi+1,strip:j+1})}}root.querySelector('[data-summary="'+w.id+'"]').textContent=`Площа ${fmt((g.B+g.T)*g.H/2*(unit==='metric'?1:1/.09290304))} ${unit==='metric'?'м²':'фут²'}`});
const result=root.querySelector('[data-result]'),cutsNode=root.querySelector('[data-cuts]');if(errors.length){result.textContent='Розрахунок потребує виправлення замірів.';cutsNode.textContent='';return}const bins=[];let impossible=false;all.sort((a,b)=>b.length-a.length).forEach(c=>{if(c.length>paper.length+1e-9){impossible=true;return}let bin=bins.find(b=>b.used+c.length<=paper.length+1e-9);if(!bin){bin={used:0,cuts:[]};bins.push(bin)}bin.used+=c.length;bin.cuts.push(c)});result.textContent=`Площа ${fmt(area*(unit==='metric'?1:1/.09290304))} ${unit==='metric'?'м²':'фут²'} · ${all.length} смуг · ${impossible?'є смуга довша за рулон':bins.length+' рулонів за деморозкроєм'}`;if(impossible){cutsNode.textContent='Збільш довжину рулону: цільна смуга не поміщається.';return}cutsNode.innerHTML=bins.map((b,i)=>`<section class="rw-roll" aria-label="Рулон ${i+1}"><h3>Рулон ${i+1}</h3><div class="rw-note">${b.cuts.length} смуг · використано ${length(b.used)}</div><table><thead><tr><th scope="col">Смуга</th><th scope="col">Стіна</th><th scope="col">Відрізати</th></tr></thead><tbody>${b.cuts.map(c=>`<tr><td>№ ${c.strip}</td><td>№ ${c.wall}</td><td>${length(c.length)}</td></tr>`).join('')}</tbody></table><div class="rw-roll-foot">Залишок рулону: ${length(Math.max(0,paper.length-b.used))}</div></section>`).join('')}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.unit){unit=b.dataset.unit;build()}else if(b.hasAttribute('data-add')){const w={id:next++,shape:'rect',bottom:4,height:2.7,top:2,offset:1,sym:true,side:'right'};walls.push(w);active=w.id;build()}else if(b.dataset.open){active=active===Number(b.dataset.open)?null:Number(b.dataset.open);build()}else if(b.dataset.remove){const id=Number(b.dataset.remove);walls=walls.filter(w=>w.id!==id);if(active===id)active=walls.length?walls[walls.length-1].id:null;build()}});
root.addEventListener('input',e=>{const input=e.target;if(!input.dataset.value)return;const owner=input.dataset.owner,obj=owner==='paper'?paper:walls.find(w=>w.id===Number(owner)),k=input.dataset.value;const pair=[...root.querySelectorAll('[data-owner="'+owner+'"][data-value="'+k+'"]')].sort((a,b)=>a.dataset.part-b.dataset.part);const a=Number(pair[0].value),b=Number(pair[1].value);obj[k]=pair.some(p=>p.value==='')||a<0||b<0||!Number.isInteger(a)?NaN:unit==='metric'?a+b/100:(a*12+b)*.0254;calculate()});
root.addEventListener('change',e=>{const t=e.target;const attr=['shape','side','sym'].find(k=>t.dataset[k]);if(!attr)return;const w=walls.find(w=>w.id===Number(t.dataset[attr]));w[attr]=attr==='sym'?t.checked:t.value;build()});
build();new ResizeObserver(()=>{const w=walls.find(w=>w.id===active);if(w&&!validate(w))diagram(w,geometry(w))}).observe(root);
})();
</script>
</div>


</main></body>
</html>
